version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    # New versions wait a week, so a bad or hijacked release is usually pulled before it reaches a pull request
    cooldown:
      default-days: 7
    ignore:
      # Must match the bundled WinFsp driver; moved by hand together with the pin in build.ps1
      - dependency-name: winfsp.net
      # WiX 6 and later carry the Open Source Maintenance Fee; VFS365 stays on WiX 5
      - dependency-name: WixToolset.*
        update-types: [version-update:semver-major]
    groups:
      nuget:
        patterns: ["*"]
  # Workflows pin actions by commit with the version in a comment; Dependabot updates both
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
