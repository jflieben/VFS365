# Builds and tests every push and pull request, including the C network provider. Actions are pinned by commit (Dependabot keeps
# them current); NuGet restores in locked mode (CI=true) against the packages.lock.json files.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Cache Zig
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\zig-portable
          key: zig-${{ runner.os }}-${{ hashFiles('build.ps1') }}

      - name: Test
        shell: pwsh
        run: ./build.ps1 test

      - name: Network provider
        shell: pwsh
        run: ./build.ps1 np
