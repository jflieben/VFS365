# Builds and tests pushes to main and every pull request, and builds the network provider, MSIs and setups (unsigned, as a release
# does) when something that goes into them changed. A newer push to a pull request cancels its older run. Actions are pinned by
# commit (Dependabot keeps them current); NuGet restores in locked mode (CI=true) against the packages.lock.json files, which also key
# the NuGet cache. Zig is cached per version pinned in build.ps1.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Test
        shell: pwsh
        run: ./build.ps1 test

  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Changes against the pull request's base or the push's previous commit; everything counts when there is none to compare with.
      # A version pushed to main is built by the release workflow, so not here as well.
      - name: Changes
        id: changes
        shell: pwsh
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          $changed = if($env:BASE -and $env:BASE -notmatch '^0+$'){ git diff --name-only $env:BASE HEAD }
          if($LASTEXITCODE -ne 0 -or -not $env:BASE -or $env:BASE -match '^0+$'){ $changed = @('src/') }
          $package = [Bool]($changed | Where-Object { $_ -match '^(src/|installer/|assets/|\.github/workflows/|build\.ps1$|global\.json$|Directory\.[^/]+\.props$|LICENSE$|THIRD-PARTY-NOTICES\.md$|VERSION$|CHANGELOG\.md$)' })
          if($package -and $env:EVENT -eq 'push' -and $changed -contains 'VERSION'){ $package = $false; 'VERSION changed on main: the release workflow builds this version.' }
          elseif(-not $package){ 'Nothing that goes into the MSIs changed; skipping them.' }
          "package=$($package.ToString().ToLower())" >> $env:GITHUB_OUTPUT
          exit 0

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.changes.outputs.package == 'true'
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Zig version
        id: zig
        if: steps.changes.outputs.package == 'true'
        shell: pwsh
        run: |
          $match = Select-String -LiteralPath build.ps1 -Pattern "^\s+Version = '([0-9.]+)'" | Select-Object -First 1
          if(-not $match){ Throw 'No Zig version found in build.ps1' }
          "version=$($match.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Cache Zig
        if: steps.changes.outputs.package == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\zig-portable
          key: zig-${{ runner.os }}-${{ runner.arch }}-${{ steps.zig.outputs.version }}

      - name: Network provider, MSIs and setups
        if: steps.changes.outputs.package == 'true'
        shell: pwsh
        run: ./build.ps1 release -NoTest
