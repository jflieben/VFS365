# Builds and tests every push and pull request, including the C network provider.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Cache Zig
        uses: actions/cache@v6
        with:
          path: ~\AppData\Local\zig-portable
          key: zig-${{ runner.os }}-${{ hashFiles('build.ps1') }}

      - name: Test
        shell: pwsh
        run: ./build.ps1 test

      - name: Network provider
        shell: pwsh
        run: ./build.ps1 np
