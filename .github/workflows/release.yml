# Publishes a GitHub release when VERSION on main names a version that has no release yet. Release notes come from that version's
# CHANGELOG.md entry; the build fails without one.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          if ($exists -eq 'true') { "v$version is already released; nothing to do." }
          exit 0

      - uses: actions/setup-dotnet@v6
        if: steps.version.outputs.exists == 'false'
        with:
          dotnet-version: 10.0.x

      - name: Build
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        run: ./build.ps1 release

      - name: Publish
        if: steps.version.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $assets = Get-ChildItem "release/$version" -File | Where-Object { $_.Extension -in '.exe', '.msi', '.zip' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object FullName
          gh release create "v$version" --target $env:GITHUB_SHA --title "VFS365 $version" --notes-file artifacts/release-notes.md @assets
