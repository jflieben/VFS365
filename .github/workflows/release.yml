# Publishes a GitHub release when VERSION on main names a version that has no release yet. Release notes come from that version's
# CHANGELOG.md entry; the build fails without one. Builds, signing and publishing run for main only.
#
# Each job has only the rights it needs: tests and the builds read the repository; only publish creates the release and the build
# provenance attestation. Verify a file with:
#   gh attestation verify <file> --repo <owner>/<repo> --signer-workflow <owner>/<repo>/.github/workflows/release.yml --source-ref refs/heads/main
# The WinFsp MSI is upstream's (pinned by hash in build.ps1), so it gets no attestation from here. Actions are pinned by commit
# (Dependabot keeps them current); NuGet restores in locked mode against the packages.lock.json files (CI=true).
#
# Code signing with Azure Artifact Signing (formerly Trusted Signing): with the repository variable SIGNING_PROFILE set to the
# certificate profile name (Settings, Secrets and variables, Actions, Variables), package signs vfs365np.dll, VFS365's exes and DLLs,
# the MSIs and the setups before the checksums, and fails when a program, DLL, MSI or setup, or a program or DLL inside the MSIs, is
# not validly signed (winfsp-msil.dll excepted, see build.ps1). Without it the release is unsigned. No secret is stored: package signs
# in to Azure with GitHub's OIDC token as app "VFS365 release signing", whose federated credential trusts this repository's
# environment "release" (limit it to the main branch: Settings, Environments, release, Deployment branches) and which needs the
# Artifact Signing Certificate Profile Signer role on the account or profile. The sign-in lives only in package, which compiles
# nothing: build compiles and publishes everything unsigned on another machine.
name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions: {}

env:
  SIGNING_CLIENT_ID: cb8cbae6-dea1-4aec-986f-fe6f122dfdf3
  SIGNING_TENANT_ID: ab773612-c917-4af5-8b81-4a5222340706
  SIGNING_ENDPOINT: https://weu.codesigning.azure.net/
  SIGNING_ACCOUNT: jsolvebv

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Version
        id: version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if($version -notmatch '^\d+\.\d+\.\d+$'){ Throw "VERSION holds '$version'" }
          "version=$version" >> $env:GITHUB_OUTPUT
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = if ($LASTEXITCODE -eq 0) { 'true' } else { 'false' }
          "exists=$exists" >> $env:GITHUB_OUTPUT
          if ($exists -eq 'true') { "v$version is already released; nothing to do." }
          exit 0

  test:
    needs: version
    if: needs.version.outputs.exists == 'false'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Test
        shell: pwsh
        run: ./build.ps1 test -Release

  build:
    needs: [version, test]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Build
        shell: pwsh
        run: ./build.ps1 release -NoTest -BuildOnly

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned
          path: |
            artifacts/np
            artifacts/publish
            artifacts/winfsp
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [version, build]
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    environment: release
    permissions:
      contents: read
      id-token: write # Azure sign-in for signing; unused when signing is off
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: unsigned
          path: artifacts

      - name: Signing client
        if: vars.SIGNING_PROFILE != ''
        shell: pwsh
        env:
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          # Microsoft's signtool plug-in for Artifact Signing (its own licence terms); a build tool only, nothing of it ships
          $version = '1.0.146'
          $sha256 = '7761E5D8F31E54B764DA21D33CD8B0A2940E1B05526C7DFCB5E94B0431426F70'
          $root = Join-Path $env:RUNNER_TEMP 'signing'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $package = Join-Path $root 'client.zip'
          Invoke-WebRequest "https://api.nuget.org/v3-flatcontainer/microsoft.artifactsigning.client/$version/microsoft.artifactsigning.client.$version.nupkg" -OutFile $package
          if((Get-FileHash $package -Algorithm SHA256).Hash -ne $sha256){ Throw 'The signing client does not match its pinned SHA256' }
          Expand-Archive -LiteralPath $package -DestinationPath (Join-Path $root 'client')
          $metadata = Join-Path $root 'metadata.json'
          @{ Endpoint = $env:SIGNING_ENDPOINT; CodeSigningAccountName = $env:SIGNING_ACCOUNT; CertificateProfileName = $env:SIGNING_PROFILE } |
            ConvertTo-Json | Set-Content -LiteralPath $metadata -Encoding utf8
          "VFS365_SIGN_DLIB=$(Join-Path $root 'client\bin\x64\Azure.CodeSigning.Dlib.dll')" >> $env:GITHUB_ENV
          "VFS365_SIGN_METADATA=$metadata" >> $env:GITHUB_ENV

      # Signed in from here to the sign-out: only signtool and the WiX builds of the MSIs and setups run meanwhile
      - name: Azure sign-in for signing
        if: vars.SIGNING_PROFILE != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ env.SIGNING_CLIENT_ID }}
          tenant-id: ${{ env.SIGNING_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Package
        shell: pwsh
        env:
          SIGNING_PROFILE: ${{ vars.SIGNING_PROFILE }}
        run: |
          # Signing set up means a signed release or none; build.ps1 then also checks every signature
          if($env:SIGNING_PROFILE -and -not ($env:VFS365_SIGN_DLIB -and $env:VFS365_SIGN_METADATA)){ Throw 'SIGNING_PROFILE is set, but the signing client is not' }
          ./build.ps1 release -PackageOnly

      - name: Azure sign-out
        if: always() && vars.SIGNING_PROFILE != ''
        shell: pwsh
        run: az account clear

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            release/${{ needs.version.outputs.version }}
            artifacts/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [version, package]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release
      id-token: write # sign the attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release

      # VFS365's own files and the checksums; not the WinFsp MSI, which is upstream's
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/${{ needs.version.outputs.version }}/VFS365-*
            release/${{ needs.version.outputs.version }}/vfs365-monitoring.html
            release/${{ needs.version.outputs.version }}/SHA256SUMS.txt

      # Exactly the files SHA256SUMS.txt lists, and the list itself
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          $folder = "release/$env:VERSION"
          $assets = @(Get-Content "$folder/SHA256SUMS.txt" | ForEach-Object { Join-Path $folder ($_ -split '  ', 2)[1] }) + (Join-Path $folder 'SHA256SUMS.txt')
          gh release create "v$env:VERSION" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "VFS365 $env:VERSION" --notes-file artifacts/release-notes.md @assets
