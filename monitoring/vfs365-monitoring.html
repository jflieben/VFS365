<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VFS365 monitoring</title>
<meta name="description" content="Dashboard for VFS365's monitoring tables: usage statistics, errors and installs, read straight from your Azure table storage.">
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --surface-2: #f3f2ee;

  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #d03b3b; --good-ink: #006300;
  --shadow: 0 8px 30px rgba(0,0,0,0.12);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
    --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
    --accent: #3987e5; --accent-ink: #ffffff; --link: #86b6ef;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #5f5e59;
    --good-ink: #0ca30c; --shadow: 0 8px 30px rgba(0,0,0,0.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --surface-2: #232321;
  --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10);
  --accent: #3987e5; --accent-ink: #ffffff; --link: #86b6ef;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #5f5e59;

button { cursor: pointer; }
.wrap { max-width: 1440px; margin: 0 auto; padding: 0 16px 48px; }

.brand { font-weight: 650; font-size: 16px; display: flex; align-items: center; gap: 8px; }

.btn { border: 1px solid var(--ring); background: var(--surface); padding: 6px 12px; border-radius: 8px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.small { padding: 3px 9px; font-size: 12.5px; }
.btn.link { border: 0; background: none; padding: 0; color: var(--link); text-decoration: underline; }
select, input[type=search] { border: 1px solid var(--ring); background: var(--surface); border-radius: 8px; padding: 6px 10px; }
.filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 16px 0 12px; }
.seg { display: inline-flex; border: 1px solid var(--ring); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; }

.seg button[aria-pressed=true]::before { content: "✓ "; font-weight: 700; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 16px; min-width: 0; }
.card h2 { font-size: 15px; margin: 0; font-weight: 650; }
.card .sub { color: var(--ink-2); font-size: 12.5px; margin-top: 2px; }
.card-head { display: flex; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
.card-head > div:first-child { flex: 1; min-width: 0; }
.grid { display: grid; gap: 12px; }
.kpis { grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.charts { grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); margin-top: 12px; }
.tables { grid-template-columns: 1fr; margin-top: 12px; }
.kpi { padding: 14px 16px; }
.kpi .label { color: var(--ink-2); font-size: 12.5px; }
.kpi .value { font-size: 26px; font-weight: 650; margin-top: 2px; }
.kpi .note { color: var(--ink-2); font-size: 12.5px; min-height: 18px; }
.kpi svg { display: block; margin-top: 6px; width: 100%; height: 28px; }
.delta-good { color: var(--good-ink); } .delta-bad { color: var(--critical); }
.insights { margin-top: 12px; }
.insight { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--grid); }
.insight:first-of-type { border-top: 0; }

.insight .text { flex: 1; }
.insight .label { font-weight: 650; margin-right: 6px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; color: var(--ink-2); font-size: 12.5px; margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.key-rect { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.key-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }

.empty { color: var(--muted); padding: 24px 0; text-align: center; }
.tooltip { position: fixed; z-index: 50; pointer-events: none; background: var(--surface); border: 1px solid var(--ring); box-shadow: var(--shadow); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 140px; display: none; }
.tooltip .t-title { color: var(--ink-2); margin-bottom: 4px; }
.tooltip .t-row { display: flex; align-items: center; gap: 8px; }
.tooltip .t-row b { font-variant-numeric: tabular-nums; margin-left: auto; padding-left: 12px; }
table.data { width: 100%; border-collapse: collapse; font-size: 13px; }
table.data th, table.data td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
table.data th { color: var(--ink-2); font-weight: 600; font-size: 12.5px; white-space: nowrap; user-select: none; }
table.data th.sortable { cursor: pointer; }
table.data th.sortable:hover { color: var(--ink); }
table.data td.num, table.data th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.click { cursor: pointer; }
table.data tr.click:hover td { background: var(--surface-2); }
.table-scroll { overflow-x: auto; }
.msg { max-width: 640px; overflow-wrap: anywhere; }
.badge { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 11.5px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; }
.tabs button { border: 0; background: none; padding: 6px 10px; border-radius: 8px; color: var(--ink-2); }
.tabs button[aria-selected=true] { background: var(--surface-2); color: var(--ink); font-weight: 650; }
.more { margin-top: 8px; }
.panel { max-width: 860px; margin: 32px auto; }
.panel h1 { font-size: 22px; margin: 0 0 4px; }
.panel textarea { width: 100%; min-height: 96px; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); padding: 10px; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }
.panel .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.panel ul { margin: 6px 0; padding-left: 20px; }
.problem { border-left: 4px solid var(--critical); }
.problem.warning { border-left-color: var(--warning); }
pre.cmd { background: var(--surface-2); border-radius: 8px; padding: 10px; overflow-x: auto; font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.drawer-back { position: fixed; inset: 0; background: rgba(0,0,0,0.35); z-index: 30; display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(760px, 100%); background: var(--page); z-index: 31; overflow-y: auto; box-shadow: var(--shadow); display: none; }
.drawer .wrap { padding-top: 16px; }
.drawer h2 { margin: 0; font-size: 18px; }
.loading { opacity: 0.55; transition: opacity 0.2s; }
.progress { font-size: 12.5px; color: var(--ink-2); }
.footer { color: var(--muted); font-size: 12px; margin-top: 24px; }
details.note { margin-top: 8px; color: var(--ink-2); font-size: 12.5px; }
details.note summary { cursor: pointer; color: var(--link); }
details.note dl { margin: 6px 0 0; }
details.note dt { font-weight: 650; color: var(--ink); margin-top: 6px; }
details.note dd { margin: 0; }
@media (max-width: 640px) { .kpi .value { font-size: 22px; } .hide-narrow { display: none; } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" d="M7 18a5 5 0 0 1-.6-9.96A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z"/><rect x="7" y="13.5" width="10" height="1.6" rx=".8" fill="var(--surface)"/></svg>VFS365 monitoring</div>
  <div class="status-line" id="statusLine"></div>
  <div class="spacer"></div>
  <label class="status-line" title="How often the data is read again">Refresh
    <select id="refreshEvery" aria-label="Refresh every">
      <option value="0">off</option><option value="1">every minute</option><option value="5" selected>every 5 minutes</option>
      <option value="15">every 15 minutes</option><option value="30">every 30 minutes</option><option value="60">every hour</option>
    </select></label>
  <button class="btn small" id="refreshNow">Refresh now</button>
  <button class="btn small" id="themeToggle" title="Light or dark">Theme</button>
  <button class="btn small" id="changeConnection">Connection</button>
</div></header>

<main class="wrap" id="main"></main>
<div class="tooltip" id="tooltip" role="status"></div>
<div class="drawer-back" id="drawerBack"></div>
<aside class="drawer" id="drawer" aria-modal="true" role="dialog"><div class="wrap" id="drawerBody"></div></aside>

<script>

const pad = n => String(n).padStart(2, "0");
const localDay = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const utcDay = d => d.toISOString().slice(0, 10);
const dayToDate = day => new Date(day + "T12:00:00");
const addDays = (d, n) => { const r = new Date(d); r.setDate(r.getDate() + n); return r; };
const shortDay = day => dayToDate(day).toLocaleDateString(undefined, { month: "short", day: "numeric" });

/* ---------- Connection and SAS ---------- */

};

  if (p.tn) out.push({ level: "warning", text: `This SAS is for the table "${p.tn}" only; the dashboard reads statistics, errors and devices. Use an account SAS for the Table service.` });
  if (p.ss && !p.ss.includes("t")) out.push({ level: "critical", text: `The SAS is not for the Table service (allowed services: ${p.ss}).` });
  if (p.srt && !p.srt.includes("o")) out.push({ level: "critical", text: "The SAS lacks resource type Object (srt has no o), which reading rows needs." });

    chartCard("Versions in use", m.latest ? `Devices per version; ${m.latest} is the newest seen` : "Devices per version",
      el => barChart(el, m.versions.map(v => ({ label: v.version, value: v.devices, tip: "devices" })), { format: fmtInt, emphasis: item => item.label === m.latest }),
      () => m.versions, [{ label: "Version", value: r => r.version }, { label: "Devices", num: true, value: r => r.devices }]));

  const tabs = [["devices", `Devices (${fmtInt(m.devices.length)})`], ["users", `Users (${fmtInt(m.users.length)})`], ["errors", `Errors (${fmtInt(m.errors.length)})`], ["installs", `Installs (${fmtInt(m.installs.length)})`]];
  const tabBody = h("div");
  const tabBar = h("div", { class: "tabs", role: "tablist" }, tabs.map(([key, label]) => h("button", { role: "tab", "aria-selected": String(ui.tab === key), onclick: () => { ui.tab = key; render(); } }, label)));
  tabBody.append(tabContent(m));
  const tables = h("div", { class: "grid tables" }, h("section", { class: "card", id: "tables" }, h("div", { class: "card-head" }, h("div", {}, tabBar)), h("div", { class: "table-scroll" }, tabBody)));

  const footer = h("p", { class: "footer" }, `Read ${dateTime(data.loadedAt)} from ${data.sample ? "sample data" : ui.conn.host}. Statistics are per day, device and user, sent the day after; errors arrive at once; installs come from the installer.`);
  $("main").replaceChildren(filterRow(m), insightCard, h("div", { style: "height:12px" }), kpis, charts, tables, footer);
  statusLine(ui.conn);
}

function tabContent(m) {
  if (ui.tab === "devices") return dataTable([
    { label: "Device", value: r => r.name.toLowerCase(), render: r => r.name },
    { label: "Users", value: r => r.users.size, num: true },
    { label: "Version", value: r => r.version, sort: r => r.version.split(".").map(n => n.padStart(5, "0")).join("."), render: r => versionBadge(r.version, m.latest) },
    { label: "Last seen", value: r => r.lastSeen?.getTime() || 0, render: r => ago(r.lastSeen) },
    { label: "Errors", value: r => r.errors, num: true, render: r => r.crashes ? `${r.errors} (${r.crashes} crash)` : fmtInt(r.errors) },
    { label: "Resource units", value: r => r.ru, num: true, render: r => compact(r.ru), narrow: true },
    { label: "Throttled", value: r => r.throttled, num: true, narrow: true },
    { label: "Install", value: r => r.install?.at?.getTime() || 0, render: r => r.install ? `${r.install.Action} ${r.install.Version}, ${dateTime(r.install.at)}` : "", narrow: true },

  if (ui.tab === "users") return dataTable([
    { label: "User", value: r => r.key.toLowerCase(), render: r => r.upn || r.windows || r.key },
    { label: "Windows user", value: r => r.windows, narrow: true },
    { label: "Devices", value: r => r.devices.size, num: true },
    { label: "Days active", value: r => r.days.size, num: true },
    { label: "Last seen", value: r => r.lastSeen?.getTime() || 0, render: r => ago(r.lastSeen) },
    { label: "Errors", value: r => r.errors, num: true },
    { label: "Resource units", value: r => r.ru, num: true, render: r => compact(r.ru), narrow: true },
    { label: "Data", value: r => r.rx + r.tx, num: true, render: r => bytes(r.rx + r.tx), narrow: true },
    { label: "Budget wait", value: r => r.budgetUser, num: true, render: r => r.budgetUser ? duration(r.budgetUser) : "", narrow: true },
  ], m.users, { onClick: openUser, sort: { label: "Errors" } });
  if (ui.tab === "errors") {
    const switcher = h("div", { class: "seg", style: "margin-bottom:8px" }, [["groups", "Grouped"], ["all", "Every error"]].map(([key, label]) => h("button", { "aria-pressed": String(ui.errorView === key), onclick: () => { ui.errorView = key; render(); } }, label)));
    const table = ui.errorView === "groups"
      ? dataTable([
        { label: "Source", value: r => r.source, render: r => sourceDot(r.source) },
        { label: "Error", value: r => r.pattern, wrap: true, render: r => r.sample },
        { label: "Count", value: r => r.rows.length, num: true },
        { label: "Devices", value: r => r.devices.size, num: true },

      ], m.groups, { onClick: openGroup })
      : errorList(m.errors);
    return h("div", {}, switcher, table);
  }
  return dataTable([
    { label: "When", value: r => r.at.getTime(), render: r => dateTime(r.at) },
    { label: "Device", value: r => (r.DeviceName || "").toLowerCase(), render: r => r.DeviceName },
    { label: "Action", value: r => r.Action },
    { label: "Version", value: r => r.Version || "" },
    { label: "Signed-in users", value: r => r.Users || "", wrap: true, narrow: true },
  ], m.installs, { onClick: r => openDevice(m.devices.find(d => d.id === r.DeviceId)) });
}
function errorList(rows) {
  return dataTable([
    { label: "When", value: r => r.at.getTime(), render: r => dateTime(r.at) },
    { label: "Device", value: r => (r.DeviceName || "").toLowerCase(), render: r => r.DeviceName },
    { label: "User", value: r => userOf(r).toLowerCase(), render: r => userOf(r), narrow: true },
    { label: "Version", value: r => r.Version || "", narrow: true },
    { label: "Source", value: r => r.Source || "", render: r => sourceDot(r.Source || "other") },
    { label: "Message", value: r => r.Message || "", wrap: true },
  ], rows, { onClick: r => openDevice(ui.model.devices.find(d => d.id === r.DeviceId)) });
}
function showTab(tab) { ui.tab = tab; render(); $("tables")?.scrollIntoView({ behavior: "smooth" }); }
function openGroupBySource(source) { const g = ui.model.groups.find(x => x.source === source); g ? openGroup(g) : showTab("errors"); }

/* ---------- Drilldowns ---------- */
function drawer(title, subtitle, ...content) {
  $("drawerBody").replaceChildren(h("div", { class: "card-head" }, h("div", {}, h("h2", {}, title), subtitle ? h("div", { class: "sub" }, subtitle) : null), h("button", { class: "btn small", onclick: closeDrawer }, "Close")), ...content);
  $("drawer").style.display = "block"; $("drawerBack").style.display = "block";
  $("drawer").scrollTop = 0;
}
function closeDrawer() { $("drawer").style.display = "none"; $("drawerBack").style.display = "none"; hideTip(); }
$("drawerBack").addEventListener("click", closeDrawer);
addEventListener("keydown", e => { if (e.key === "Escape") closeDrawer(); });
const facts = list => h("div", { class: "grid kpis", style: "margin:12px 0" }, list.map(([label, value]) => h("section", { class: "card kpi" }, h("div", { class: "label" }, label), h("div", { class: "value", style: "font-size:20px" }, value))));
const budgetFacts = x => [["Budget wait, user actions", duration(x.budgetUser)], ["Budget wait, background", duration(x.budgetBackground)],
  ...(x.budgetUnsplit ? [["Budget wait, not split", duration(x.budgetUnsplit)]] : [])];
function rowsFor(match) {
  const m = ui.model;
  const stats = [...data.statistics.values()].flat().filter(r => match(r) && r.PartitionKey >= m.statDays[0]);
  const perDay = m.statDays.map(d => stats.filter(r => r.PartitionKey === d));
  return { stats, perDay };
}
function usageCard(title, perDay) {
  const m = ui.model;
  const body = h("div");
  const card = h("section", { class: "card", style: "margin-top:12px" }, h("div", { class: "card-head" }, h("div", {}, h("h2", {}, title))), body);
  requestAnimationFrame(() => timeChart(body, { days: m.statDays, type: "columns", format: compact, series: [
    { label: "Graph", color: "--s1", values: perDay.map(rows => rows.reduce((t, r) => t + num(r.GraphRequests), 0)) },
    { label: "SharePoint", color: "--s2", values: perDay.map(rows => rows.reduce((t, r) => t + num(r.SharePointRequests), 0)) }] }));
  return card;
}
function openDevice(d) {
  if (!d) return;
  const m = ui.model, { perDay } = rowsFor(r => r.DeviceId === d.id);
  const errors = m.errors.filter(r => r.DeviceId === d.id), installs = data.devices.filter(r => r.DeviceId === d.id).map(r => ({ ...r, at: new Date(r.OccurredAt || r.Timestamp) })).sort((a, b) => b.at - a.at);
  drawer(d.name, `Device ID ${d.id}${d.entra ? ` · Entra device ID ${d.entra}` : ""}`,
    facts([["Version", d.version || "unknown"], ["Users", fmtInt(d.users.size)], ["Last seen", ago(d.lastSeen)], ["Errors", fmtInt(d.errors)], ["Resource units", compact(d.ru)], ["Running", `${fmtInt(d.minutes / 60)} h`], ...budgetFacts(d)]),
    usageCard("Requests per day", perDay),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Users"), h("p", {}, [...d.users].join(", ") || "none")),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, `Errors (${errors.length})`), h("div", { class: "table-scroll" }, errorList(errors))),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Install history"), installs.length
      ? h("div", { class: "table-scroll" }, dataTable([{ label: "When", value: r => r.at.getTime(), render: r => dateTime(r.at) }, { label: "Action", value: r => r.Action }, { label: "Version", value: r => r.Version }, { label: "Signed-in users", value: r => r.Users || "", wrap: true }], installs))
      : h("p", { class: "sub" }, "No install reports for this device.")));
}
function openUser(u) {
  const m = ui.model, { perDay } = rowsFor(r => userOf(r) === u.key);
  const errors = m.errors.filter(r => userOf(r) === u.key);
  drawer(u.upn || u.key, u.windows ? `Windows user ${u.windows}` : "",
    facts([["Devices", fmtInt(u.devices.size)], ["Days active", fmtInt(u.days.size)], ["Last seen", ago(u.lastSeen)], ["Errors", fmtInt(u.errors)], ["Resource units", compact(u.ru)], ["Data", bytes(u.rx + u.tx)], ...budgetFacts(u)]),
    usageCard("Requests per day", perDay),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Devices"), h("p", {}, [...u.devices].map(id => m.devices.find(d => d.id === id)?.name || id).join(", ") || "none")),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, `Errors (${errors.length})`), h("div", { class: "table-scroll" }, errorList(errors))));
}
function openGroup(g) {
  const m = ui.model, body = h("div");
  drawer(g.source, `Seen ${g.rows.length} time(s) on ${g.devices.size} device(s), ${g.users.size} user(s); first ${dateTime(g.first)}, last ${dateTime(g.last)}`,
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Latest message"), h("p", { class: "msg" }, g.sample)),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Per day"), body),
    h("section", { class: "card", style: "margin-top:12px" }, h("h2", {}, "Occurrences"), h("div", { class: "table-scroll" }, errorList(g.rows))));
  requestAnimationFrame(() => timeChart(body, { days: m.days, type: "columns", format: fmtInt, series: [{ label: g.source, color: SOURCE_COLOR[g.source] || "--s1", values: m.days.map(d => g.rows.filter(r => localDay(r.at) === d).length) }] }));
}

/* ---------- Sample data (for a look without a storage account) ---------- */
function makeSample() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const today = new Date(), stats = new Map(), errors = new Map(), devices = [];
  const tenant = "00000000-0000-0000-0000-000000000365";
  const hosts = Array.from({ length: 14 }, (_, i) => ({ id: crypto.randomUUID?.() || `device-${i}`, name: i < 6 ? `AVD-HOST-${pad(i + 1)}` : `LT-${1000 + i * 37}`, avd: i < 6 }));
  const people = Array.from({ length: 60 }, (_, i) => `user${pad(i + 1)}@contoso.example`);
  const versionOn = (day, k) => day < localDay(addDays(today, -40 + (k % 5))) ? "0.1.9" : k % 5 === 4 || day < localDay(addDays(today, -12 + (k % 4))) ? "0.2.0" : "0.3.0";
  hosts.forEach((d, k) => {
    devices.push({ PartitionKey: d.id, RowKey: "a" + k, DeviceId: d.id, DeviceName: d.name, Action: "install", Version: "0.1.9", OccurredAt: addDays(today, -58).toISOString(), Users: "" });
    devices.push({ PartitionKey: d.id, RowKey: "b" + k, DeviceId: d.id, DeviceName: d.name, Action: "update", Version: "0.2.0", OccurredAt: addDays(today, -40 + (k % 5)).toISOString(), Users: "" });
    if (k % 5 !== 4) devices.push({ PartitionKey: d.id, RowKey: "c" + k, DeviceId: d.id, DeviceName: d.name, Action: "update", Version: "0.3.0", OccurredAt: addDays(today, -12 + (k % 4)).toISOString(), Users: "" });
  });
  const sampleWaits = (version, back) => {
    const background = back % 7 === 1 ? Math.round(rnd() * 40) : 0, user = back === 9 && rnd() < 0.3 ? Math.round(rnd() * 20) : 0;
    return version === "0.3.0"
      ? { BudgetWaitSeconds: String(user + background), BudgetWaitForegroundSeconds: String(user), BudgetWaitBackgroundSeconds: String(background) }
      : { BudgetWaitSeconds: String(user + background) };
  };
  for (let back = 89; back >= 1; back--) {
    const date = addDays(today, -back), day = localDay(date), weekend = [0, 6].includes(date.getDay());
    const rows = [];
    hosts.forEach((d, k) => {
      if (k === 13 && back < 6) return;
      const users = d.avd ? people.slice(k * 8, k * 8 + 8) : [people[48 + k - 6]];
      for (const u of users) {
        if (rnd() < (weekend ? 0.85 : 0.12)) continue;
        const busy = 0.4 + rnd() * 1.6, throttle = back === 23 || back === 9 ? Math.floor(rnd() * 6) : 0;
        const graph = Math.round(120 * busy), sp = Math.round(40 * busy + (back % 7 === 1 ? 300 : 0));
        rows.push({ PartitionKey: day, RowKey: d.id + "_" + u, Day: day, DeviceId: d.id, DeviceName: d.name, User: u, WindowsUser: "CONTOSO\\" + u.split("@")[0], TenantId: tenant,
          Version: versionOn(day, k), GraphRequests: String(graph), SharePointRequests: String(sp), ResourceUnits: String(graph * 1.4 + sp * 2 | 0),
          BytesReceived: String(Math.round(busy * 9e7)), BytesSent: String(Math.round(busy * 2.2e7)), Throttled: String(throttle), ThrottledSeconds: String(throttle * 12),
          Errors: 0, MinutesRunning: Math.round(300 + rnd() * 200), ...sampleWaits(versionOn(day, k), back) });
      }
    });
    stats.set(day, rows);
  }
  const messages = {
    upload: ["\\Sites\\Finance\\Documents\\Budget 2027.xlsx: The operation has timed out.", "\\OneDrive\\Exports\\report.csv: 503 Service Unavailable"],
    "conflict copy": ["\\Sites\\Sales\\Documents\\Offer.docx was changed or locked in Microsoft 365; saved as Offer (conflict 2026-10-02 1412).docx"],
    "sign-in": ["AADSTS50076: Due to a configuration change made by your administrator, you must use multi-factor authentication."],
    "file system": ["IOException: The process cannot access the file because it is being used by another process."],
    discovery: ["503 Service Unavailable from https://contoso.sharepoint.com/_api/search/query"],
    crash: ["The agent stopped unexpectedly (exit code 0xC0000005) and was started again"],
    "drive letter": ["T: is also remembered as a mapping to \\\\fs01\\data (HKCU\\Network\\T, from a drive mapping policy). Explorer can show that mapping as a disconnected network drive."],
  };
  for (let back = 89; back >= 0; back--) {
    const n = Math.floor(rnd() * 4) + (back === 9 ? 14 : 0) + (back < 2 ? 3 : 0);
    for (let i = 0; i < n; i++) {
      const at = addDays(today, -back); at.setHours(8 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
      if (at > today) continue;
      const source = back === 9 && i < 10 ? "upload" : pick(["upload", "upload", "conflict copy", "sign-in", "file system", "discovery", "crash", "drive letter"]);
      const d = pick(hosts), u = d.avd ? pick(people.slice(0, 48)) : people[48 + hosts.indexOf(d) - 6];
      const key = utcDay(at);
      if (!errors.has(key)) errors.set(key, []);
      errors.get(key).push({ PartitionKey: key, RowKey: String(i), DeviceId: d.id, DeviceName: d.name, User: u, WindowsUser: "CONTOSO\\" + u.split("@")[0], TenantId: tenant, Version: versionOn(localDay(at), hosts.indexOf(d)), Source: source, Message: pick(messages[source]), OccurredAt: at.toISOString() });
    }
  }
  data.statistics = stats; data.errors = errors; data.devices = devices; data.missing = new Set(); data.loadedAt = new Date(); data.sample = true;
}

/* ---------- Start ---------- */
$("refreshNow").addEventListener("click", () => refresh(true));
$("refreshEvery").value = store.get("refreshEvery") ?? "5";
$("refreshEvery").addEventListener("change", e => { store.set("refreshEvery", e.target.value); scheduleRefresh(); statusLine(ui.conn); });
$("changeConnection").addEventListener("click", () => { data.sample = false; ui.conn = null; statusLine(null); connectionPanel(); });
$("themeToggle").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme); if (ui.conn) render();
});
if (store.get("theme")) document.documentElement.dataset.theme = store.get("theme");
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (ui.conn) render(); });
let resizeTimer; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => chartRenders.forEach(f => f()), 150); });

(function start() {
  const hash = new URLSearchParams(location.hash.slice(1));
  const initial = hash.get("connect") || store.get("connection");
  if (hash.has("sample")) { makeSample(); startWith({ base: "", sas: "", params: {}, account: "sample", host: "sample" }); return; }
  if (initial) { try { startWith(parseConnection(initial)); return; } catch { } }
  connectionPanel();
})();
