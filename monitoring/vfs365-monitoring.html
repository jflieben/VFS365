/* Error reports per shown day, as a chart in the drawer */
function errorDays(body, label, color, rows) {
  const m = ui.model, perDay = groupBy(rows, r => r._day);
  drawerChart(body, () => timeChart(body, { days: m.days, type: "columns", format: fmtInt, series: [{ label, color, values: m.days.map(d => perDay.get(d)?.length || 0) }] }));
}
function openGroup(g) {
  const body = h("div");
  errorDays(body, g.source, SOURCE_COLOR[g.source] || "--other", g.rows);
  drawer({ kind: "group", id: g.key }, g.source, `Reported ${g.rows.length} time(s) on ${g.devices.size} device(s), ${g.users.size} user(s); first ${dateTime(g.first)}, last ${dateTime(g.last)}`,
    card(h("h2", {}, "Latest message"), h("p", { class: "msg" }, g.sample)),
    card(h("h2", {}, "Per day"), body),
    card(h("h2", {}, "Occurrences"), h("div", { class: "table-scroll" }, errorList(g.rows))));
}
/* All errors of a source: one kind opens as its group, several as a list of the kinds and every report */
function openSource(source) {
  const m = ui.model, groups = m.groups.filter(g => g.source === source);
  if (groups.length < 2) return groups.length ? openGroup(groups[0]) : showTab("errors");
  const rows = groups.flatMap(g => g.rows).sort((a, b) => b.at - a.at), body = h("div");
  errorDays(body, source, SOURCE_COLOR[source] || "--other", rows);
  drawer({ kind: "source", id: source }, source, `Reported ${rows.length} time(s) in ${groups.length} kinds on ${new Set(rows.map(r => r._dev)).size} device(s), ${new Set(rows.map(userOf)).size} user(s)`,
    card(h("h2", {}, "Per day"), body),
    card(h("h2", {}, "Kinds"), h("div", { class: "table-scroll" }, groupTable(groups))),
    card(h("h2", {}, "Every report"), h("div", { class: "table-scroll" }, errorList(rows))));
}

/* ---------- Sample data (for a look without a storage account) ---------- */
function makeSample() {
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = a => a[Math.floor(rnd() * a.length)];
  const today = new Date(), stats = new Map(), errors = new Map(), devices = [];
  strings.clear(); identities.clear();
  // Two tenants: the last two laptops belong to the second
  const tenantOf = k => k >= 12 ? "00000000-0000-0000-0000-00000000fab1" : "00000000-0000-0000-0000-000000000365";
  const hosts = Array.from({ length: 14 }, (_, i) => ({ id: crypto.randomUUID?.() || `device-${i}`, name: i < 6 ? `AVD-HOST-${pad(i + 1)}` : `LT-${1000 + i * 37}`, avd: i < 6 }));
  const people = Array.from({ length: 60 }, (_, i) => `user${pad(i + 1)}@contoso.example`);
  // Updates roll out over a few days; every fifth device stays on 0.4.1
  const versionOn = (day, k) => day < localDay(addDays(today, -70 + (k % 5))) ? "0.1.9" : day < localDay(addDays(today, -45 + (k % 4))) ? "0.2.0"
    : k % 5 === 4 || day < localDay(addDays(today, -26 + (k % 4))) ? "0.4.1" : "0.7.0";
  const install = row => devices.push(prepare("devices", row));
  hosts.forEach((d, k) => {
    install({ PartitionKey: d.id, RowKey: "a" + k, DeviceId: d.id, DeviceName: d.name, Action: "install", Version: "0.1.9", OccurredAt: addDays(today, -90).toISOString(), Users: "" });
    install({ PartitionKey: d.id, RowKey: "b" + k, DeviceId: d.id, DeviceName: d.name, Action: "update", Version: "0.2.0", OccurredAt: addDays(today, -70 + (k % 5)).toISOString(), Users: "" });
    install({ PartitionKey: d.id, RowKey: "c" + k, DeviceId: d.id, DeviceName: d.name, Action: "update", Version: "0.4.1", OccurredAt: addDays(today, -45 + (k % 4)).toISOString(), Users: "" });
    if (k % 5 !== 4) install({ PartitionKey: d.id, RowKey: "d" + k, DeviceId: d.id, DeviceName: d.name, Action: "update", Version: "0.7.0", OccurredAt: addDays(today, -26 + (k % 4)).toISOString(), Users: "" });
  });
  // A PC retired months ago without uninstalling: listed under devices, left out of versions
  install({ PartitionKey: "retired", RowKey: "a", DeviceId: "retired", DeviceName: "LT-0815", Action: "install", Version: "0.1.9", OccurredAt: addDays(today, -85).toISOString(), Users: "CONTOSO\\user60" });
  const sampleWaits = (version, back) => {
    const background = back % 7 === 1 ? Math.round(rnd() * 40) : 0, user = back === 9 && rnd() < 0.3 ? Math.round(rnd() * 20) : 0;
    return semverCompare(version, "0.3.0") >= 0
      ? { BudgetWaitSeconds: String(user + background), BudgetWaitForegroundSeconds: String(user), BudgetWaitBackgroundSeconds: String(background) }
      : { BudgetWaitSeconds: String(user + background) };
  };
  // Agents from 0.7.0: resource units per UTC hour over a working day (a sign-in's discovery at its start) and the busiest minute.
  // A generator of its own, so the rest of the sample stays as it was.
  let hourSeed = 11; const rndHour = () => (hourSeed = (hourSeed * 16807) % 2147483647) / 2147483647;
  const profile = [0, 0, 0, 0, 0, 0, 0, 0.4, 1, 1.6, 1.4, 1.1, 0.6, 1, 1.2, 1, 0.8, 0.4, 0.2, 0, 0, 0, 0, 0];
  const sampleHours = (date, total, discovery) => {
    const midnight = new Date(date); midnight.setHours(0, 0, 0, 0);
    const from = Math.ceil(midnight / HOUR), start = 7 + Math.floor(rndHour() * 3), stop = 15 + Math.floor(rndHour() * 4);
    const weights = Array.from({ length: 24 }, (_, i) => { const at = new Date((from + i) * HOUR).getHours(); return at >= start && at <= stop ? profile[at] * (0.6 + rndHour() * 0.8) : 0; });
    const sum = weights.reduce((t, w) => t + w, 0) || 1, first = weights.findIndex(w => w > 0), rest = Math.max(0, total - discovery);
    const values = weights.map(w => Math.floor(w / sum * rest));
    values[first + 1] += Math.floor(discovery / 2);
    values[first] += total - values.reduce((t, v) => t + v, 0);
    const last = values.findLastIndex(v => v > 0), busiest = values.indexOf(Math.max(...values)), at = discovery ? first : busiest;
    const units = Math.min(values[at], 600, Math.round(Math.max(discovery ? 150 + rndHour() * 250 : 0, values[busiest] / 60 * (3 + rndHour() * 9))));
    return { ResourceUnitsByHour: values.slice(first, last + 1).join(","), ResourceUnitsFromHour: new Date((from + first) * HOUR).toISOString(),
      PeakMinuteResourceUnits: String(units), PeakMinuteAt: new Date((from + at) * HOUR + Math.floor(rndHour() * 60) * 60000).toISOString() };
  };
  for (let back = 89; back >= 1; back--) {
    const date = addDays(today, -back), day = localDay(date), weekend = [0, 6].includes(date.getDay());
    const rows = [];
    hosts.forEach((d, k) => {
      if (k === 13 && back < 6) return;
      const users = d.avd ? people.slice(k * 8, k * 8 + 8) : [people[48 + k - 6]];
      for (const u of users) {
        if (rnd() < (weekend ? 0.85 : 0.12)) continue;
        const busy = 0.4 + rnd() * 1.6, throttle = back === 23 || back === 9 ? Math.floor(rnd() * 6) : 0;
        const graph = Math.round(120 * busy), sp = Math.round(40 * busy + (back % 7 === 1 ? 300 : 0)), ru = graph * 1.4 + sp * 2 | 0, version = versionOn(day, k);
        rows.push(prepare("statistics", { PartitionKey: day, RowKey: d.id + "_" + u, Day: day, DeviceId: d.id, DeviceName: d.name, User: u, WindowsUser: "CONTOSO\\" + u.split("@")[0], TenantId: tenantOf(k),
          Version: version, GraphRequests: String(graph), SharePointRequests: String(sp), ResourceUnits: String(ru),
          BytesReceived: String(Math.round(busy * 9e7)), BytesSent: String(Math.round(busy * 2.2e7)), Throttled: String(throttle), ThrottledSeconds: String(throttle * 12),
          Errors: Math.floor(busy * 1.5), MinutesRunning: Math.round(300 + rnd() * 200), Timestamp: addDays(date, 1).toISOString(), ...sampleWaits(version, back),
          ...(semverCompare(version, "0.7.0") >= 0 ? sampleHours(date, ru, back % 7 === 1 ? 600 : 0) : {}) }));
      }
    });
    // One day sent twice (its answer lost): the dashboard keeps the newest
    if (back === 15 && rows.length) rows.push(prepare("statistics", { ...rows[0], RowKey: rows[0].RowKey + "_again", Timestamp: addDays(date, 2).toISOString() }));
    stats.set(day, newestOnly(rows));
  }
  const messages = {
    upload: ["\\Sites\\Finance\\Documents\\Budget 2027.xlsx: The operation has timed out.", "\\OneDrive\\Exports\\report.csv: 503 Service Unavailable"],
    "conflict copy": ["\\Sites\\Sales\\Documents\\Offer.docx was changed or locked in Microsoft 365; saved as Offer (conflict 2026-10-02 1412).docx"],
    "sign-in": ["AADSTS50076: Due to a configuration change made by your administrator, you must use multi-factor authentication."],
    "file system": ["IOException: The process cannot access the file because it is being used by another process."],
    discovery: ["503 Service Unavailable from https://contoso.sharepoint.com/_api/search/query"],
    crash: ["The agent stopped unexpectedly (exit code 0xC0000005) and was started again"],
    "drive letter": ["T: is also remembered as a mapping to \\\\fs01\\data (HKCU\\Network\\T, from a drive mapping policy). Explorer can show that mapping as a disconnected network drive."],
    delete: ["\\Sites\\HR\\Documents\\Policy 2025.docx could not be deleted: 423 Locked (the item is held by a retention policy)"],
    agent: ["Object reference not set to an instance of an object."],
  };
  const report = row => { const key = row.PartitionKey; if (!errors.has(key)) errors.set(key, []); errors.get(key).push(prepare("errors", row)); };
  for (let back = 89; back >= 0; back--) {
    const n = Math.floor(rnd() * 4) + (back === 9 ? 14 : 0) + (back < 2 ? 3 : 0);
    for (let i = 0; i < n; i++) {
      const at = addDays(today, -back); at.setHours(8 + Math.floor(rnd() * 9), Math.floor(rnd() * 60));
      if (at > today) continue;
      const source = back === 9 && i < 10 ? "upload" : pick(["upload", "upload", "conflict copy", "sign-in", "file system", "discovery", "crash", "drive letter", "delete", "agent"]);
      const d = pick(hosts), k = hosts.indexOf(d), u = d.avd ? pick(people.slice(0, 48)) : people[48 + k - 6];
      report({ PartitionKey: utcDay(at), RowKey: `${back}_${i}`, DeviceId: d.id, DeviceName: d.name, User: u, WindowsUser: "CONTOSO\\" + u.split("@")[0], TenantId: tenantOf(k), Version: versionOn(localDay(at), k), Source: source, Message: pick(messages[source]), OccurredAt: at.toISOString() });
    }
  }
  // Throttling episodes on the throttled days, from the statistics rows that were throttled, and one this morning
  const episode = (row, at, responses, held) => report({ PartitionKey: utcDay(at), RowKey: "t" + row.RowKey, DeviceId: row.DeviceId, DeviceName: row.DeviceName, User: row.User, WindowsUser: row.WindowsUser,
    TenantId: row.TenantId, Version: row.Version, Source: "throttled", OccurredAt: at.toISOString(), ThrottledUntil: new Date(at.getTime() + held * 1000).toISOString(),
    Responses: responses, HeldSeconds: held, LongestWaitSeconds: Math.min(held, 60 + Math.round(rnd() * 60)), Status429: responses, Status503: 0,
    GraphResponses: Math.floor(responses / 3), SharePointResponses: responses - Math.floor(responses / 3), BackgroundResponses: Math.ceil(responses * 0.7),
    Message: `Microsoft throttled VFS365 for ${Math.max(1, Math.round(held / 60))} min: ${responses} response(s) (429 x${responses}).` });
  const throttledRows = [...stats.values()].flat().filter(r => r.Throttled > 0);
  for (const row of throttledRows.filter(r => semverCompare(r.Version, "0.4.1") >= 0)) {
    const at = dayToDate(row.PartitionKey); at.setHours(8, Math.floor(rnd() * 50), 0, 0);
    episode(row, at, row.Throttled, row.ThrottledSeconds + Math.round(rnd() * 120));
  }
  const morning = new Date(Math.min(Date.now() - 600000, new Date(today).setHours(9, 0, 0, 0)));
  if (throttledRows.length) episode({ ...throttledRows[throttledRows.length - 1], RowKey: "today", Version: "0.7.0" }, morning, 7, 240);
  Object.assign(data, { statistics: stats, errors, devices, missing: new Set(), pagingHidden: false, loadedAt: new Date(), sample: true, failure: null });
  data.version++; models.clear(); prepareData();
}

/* ---------- Start ---------- */
$("refreshNow").addEventListener("click", () => refresh(true));
$("refreshEvery").value = store.get("refreshEvery") ?? "5";
$("refreshEvery").addEventListener("change", e => { store.set("refreshEvery", e.target.value); scheduleRefresh(); statusLine(ui.conn); });
$("changeConnection").addEventListener("click", changeConnection);
/* Colors are CSS variables, so a theme change needs no redraw */
$("themeToggle").addEventListener("click", () => {
  const dark = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.dataset.theme = dark ? "light" : "dark"; store.set("theme", document.documentElement.dataset.theme);
});
if (store.get("theme")) document.documentElement.dataset.theme = store.get("theme");
let resizeTimer; addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (ui.view === "dashboard") paintCharts([...chartCards, ...tabCharts]); drawerCharts.forEach(f => f()); }, 150); });

/* #connect=<SAS URL> (URL-encoded, or pasted as it is) or #sample in the address. The SAS leaves the address bar (and this history
   entry) once read; the browser's history list still has it. */
function fromHash() {
  const hash = location.hash.slice(1);
  if (/^sample(&|$)/.test(hash)) return { sample: true };
  if (!hash.startsWith("connect=")) return null;
  history.replaceState(null, "", location.pathname + location.search);
  let value = hash.slice(8);
  if (!/[?&=;]/.test(value)) {
    try { value = decodeURIComponent(value); }
    catch { return { value, problem: new Problem("The #connect link is damaged", ["Its SAS URL is not URL-encoded correctly. Paste the SAS URL here instead, or make the link again."]) }; }
  }
  return { value, link: true };
}
/* Connects to what came from the address or was stored; what can't be used shows in the connection panel with the reason */
function begin(from) {
  if (from.sample) { cancelLoad(); makeSample(); startWith(sampleConnection()); return; }
  try {
    if (from.problem) throw from.problem;
    const c = parseConnection(from.value);
    if (from.link) tabLink.set(from.value);
    startWith(c);
  } catch (e) {
    cancelLoad(); closeDrawer(); ui.conn = null; data.sample = false; statusLine(null);
    connectionPanel({ problem: problemOf(e), value: from.value });
  }
}
addEventListener("hashchange", () => { const from = fromHash(); if (from) begin(from); });
(function start() {
  // Opened from disk, a SAS that an earlier version kept in the shared localStorage is removed
  if (fromDisk && store.get("connection")) { store.set("connection", null); ui.forgotSaved = true; }
  const stored = tabLink.get() || saved.get();
  const from = fromHash() || (stored ? { value: stored } : null);
  if (from) begin(from); else connectionPanel();
})();
</script>
